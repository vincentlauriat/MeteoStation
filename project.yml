name: MeteoStation
options:
  bundleIdPrefix: com.vincentlauriat
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"

# One version for both apps (macOS + iOS): bump here, release checklist checks both.
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

schemes:
  MeteoStation:
    build:
      targets:
        MeteoStation: all
    run:
      config: Debug
  MeteoStation-iOS:
    build:
      targets:
        MeteoStation-iOS: all
    run:
      config: Debug

targets:
  MeteoStation:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MeteoStation
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: MeteoStation
        PRODUCT_BUNDLE_IDENTIFIER: com.vincentlauriat.meteostation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: MeteoStation/MeteoStation.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    info:
      path: MeteoStation/Info.plist
      properties:
        CFBundleName: MeteoStation
        CFBundleDisplayName: MeteoStation
        CFBundleIdentifier: com.vincentlauriat.meteostation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat"
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/MeteoStation/main/appcast.xml"
        SUPublicEDKey: "9PD2SBwLL4XoycyAGzaE+gO7ctuxSfuFMMajiZdXhXQ="
        SUEnableAutomaticChecks: true
        # Relay over Tailscale is plain HTTP (WireGuard already encrypts it):
        # bare hostnames / IPs (local networking) and MagicDNS *.ts.net names.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  # iPhone (and iPhone Duo) companion: reads the Pi relay; personal install from Xcode.
  MeteoStation-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MeteoStation
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "MeteoStationApp.swift"
          - "Views/SettingsView.swift"
          - "Assets.xcassets"
      - path: MeteoStationiOS
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: MeteoStation
        PRODUCT_BUNDLE_IDENTIFIER: com.vincentlauriat.meteostation.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: KFLACS69T9
        CODE_SIGN_STYLE: Automatic
    info:
      path: MeteoStationiOS/Info.plist
      properties:
        CFBundleDisplayName: MeteoStation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "MeteoStation lit le relais météo sur le réseau local de la station."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
